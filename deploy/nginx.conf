server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端容器重建会换 IP，nginx 启动时解析的那一份就失效（表现为 502）。
    # 用 Docker 内置 DNS + 变量 proxy_pass，按 valid 周期重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # SPA 路由回退：非静态资源一律交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端 WriteTimeout 默认 75s（HTTP_REQUEST_TIMEOUT 15s + 15s，最长 60s+15s），
        # nginx 默认 60s 读超时会先断成 504；这里留出余量，让慢请求由后端自己收尾。
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /healthz {
        proxy_pass $api_upstream/healthz;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
