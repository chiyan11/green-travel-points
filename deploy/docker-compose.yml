# 全栈一键启动：MySQL + API + Web（nginx 静态托管 + /api 反代）。
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl http://127.0.0.1:8080/healthz        # API 直连
#   http://127.0.0.1:8088/                    # Web 入口（nginx → api）
#
# 端口默认避让本机常用端口：MySQL 3307、Web 8088、API 8080；
# 需要改端口时用环境变量覆盖，例如 MYSQL_PORT=3306 WEB_PORT=80 API_PORT=18080。
#
# 首次启动（数据卷为空）会按文件名顺序执行 01..11 的迁移，再由 99_seed.sh 导入
# db/seed/dev_demo.sql，因此 down -v && up 之后种子账号可直接登录。
# 不希望灌演示数据时设置 SEED_ON_INIT=0。
#
# 说明：本机若已安装 MySQL 服务（如 MySQL97），更省事的是跳过 mysql 服务，
# 直接把 apps/api 的 DB_DSN 指向本机实例，见 README「数据库准备」。

services:
  mysql:
    image: mysql:8.4
    container_name: gtp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: green_travel_points
      MYSQL_USER: greentravel
      MYSQL_PASSWORD: greentravel
      TZ: Asia/Shanghai
      # 1 = 首次初始化时导入 db/seed/dev_demo.sql；0 = 只建表不灌数据。
      SEED_ON_INIT: ${SEED_ON_INIT:-1}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql-data}:/var/lib/mysql
      # 迁移按文件名顺序执行，仅在数据目录为空时生效。
      # 新增 db/migrations/*.up.sql 必须在这里追加一行，否则空卷起的库会缺表。
      - ../db/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../db/migrations/000002_event_outbox.up.sql:/docker-entrypoint-initdb.d/02_event_outbox.sql:ro
      - ../db/migrations/000003_points_ledger.up.sql:/docker-entrypoint-initdb.d/03_points_ledger.sql:ro
      - ../db/migrations/000004_user_trip_carbon.up.sql:/docker-entrypoint-initdb.d/04_user_trip_carbon.sql:ro
      - ../db/migrations/000005_mall_orders.up.sql:/docker-entrypoint-initdb.d/05_mall_orders.sql:ro
      - ../db/migrations/000006_point_batch_txn.up.sql:/docker-entrypoint-initdb.d/06_point_batch_txn.sql:ro
      - ../db/migrations/000007_audit_log.up.sql:/docker-entrypoint-initdb.d/07_audit_log.sql:ro
      - ../db/migrations/000008_rule_snapshot_json.up.sql:/docker-entrypoint-initdb.d/08_rule_snapshot_json.sql:ro
      - ../db/migrations/000009_outbox_lease.up.sql:/docker-entrypoint-initdb.d/09_outbox_lease.sql:ro
      - ../db/migrations/000010_trip_raw_points.up.sql:/docker-entrypoint-initdb.d/10_trip_raw_points.sql:ro
      - ../db/migrations/000011_order_idem_per_user.up.sql:/docker-entrypoint-initdb.d/11_order_idem_per_user.sql:ro
      # 迁移全部执行完再导种子（99 排最后）；SEED_ON_INIT=0 时脚本自行跳过。
      - ../db/seed/dev_demo.sql:/seed/dev_demo.sql:ro
      - ../db/seed/docker-init.sh:/docker-entrypoint-initdb.d/99_seed.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: gtp-api
    restart: unless-stopped
    environment:
      APP_ENV: dev
      HTTP_ADDR: :8080
      DB_DSN: greentravel:greentravel@tcp(mysql:3306)/green_travel_points?parseTime=true&loc=Local&charset=utf8mb4
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # /healthz 不依赖数据库，镜像内也有 HEALTHCHECK；这里显式声明，
    # web 的 `condition: service_healthy` 才有可满足的判定。
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: gtp-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
